<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>greeting 测试</title></head>
<body>
<h1>greetingFor 测试</h1>
<pre id="out">运行中...</pre>
<script>
function greetingFor(h) {
  if (h >= 5 && h < 11) return "早上好";
  if (h >= 11 && h < 13) return "中午好";
  if (h >= 13 && h < 18) return "下午好";
  if (h >= 18 && h < 23) return "晚上好";
  return "夜深了";
}

const cases = [
  [0,  "夜深了"], [4,  "夜深了"], [5,  "早上好"], [10, "早上好"],
  [11, "中午好"], [12, "中午好"], [13, "下午好"], [17, "下午好"],
  [18, "晚上好"], [22, "晚上好"], [23, "夜深了"]
];

let pass = 0, fail = 0;
const lines = [];
for (const [h, expected] of cases) {
  const actual = greetingFor(h);
  const ok = actual === expected;
  if (ok) pass++; else fail++;
  lines.push(`${ok ? "PASS" : "FAIL"}  h=${h.toString().padStart(2," ")}  expect="${expected}"  got="${actual}"`);
}
lines.push("");
lines.push(`总计 ${pass} pass / ${fail} fail`);
document.getElementById("out").textContent = lines.join("\n");
</script>
</body>
</html>
